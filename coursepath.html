    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i += 1;
          row.push(value);
          if (row.some((cell) => cell.trim() !== '')) rows.push(row);
          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      if (value || row.length) {
        row.push(value);
        if (row.some((cell) => cell.trim() !== '')) rows.push(row);
      }
      return rows;
    }

    function buildCategoryMap(csvText) {
      const rows = parseCSV(csvText);
      const headers = rows.shift() || [];
      const nameIndex = headers.indexOf('cname');
      const categoryIndex = headers.indexOf('category');
      const map = new Map();
      rows.forEach((row) => {
        const name = (row[nameIndex] || '').trim();
        const category = (row[categoryIndex] || '').trim();
        if (name && category) map.set(name, category);
      });
      return map;
    }

    function categoryFor(course, categoryMap) {
      return categoryMap.get(course.name) || '其他';
    }

    function groupCoursesByCategory(courses, categoryMap) {
      return courses.reduce((groups, course) => {
        const category = categoryFor(course, categoryMap);
        const key = categoryOrder.includes(category) ? category : '其他';
        groups[key].push(course);
        return groups;
      }, Object.fromEntries(categoryOrder.map((category) => [category, []])));
    }

    function categoryDisplayName(category) {
      return category === '其他' ? '個人興趣選修' : category;
    }

    function renderCourse(course) {
      return `
        <div class="course-path-course mb-0.5 border border-slate-200 bg-white px-1.5 py-1 text-xs leading-snug text-slate-700">
          <span class="course-path-course__name text-[12px] leading-snug">${course.name}</span>
          ${course.waived ? '<span class="course-path-course__badge ml-1 inline-flex border border-amber-300 bg-amber-50 px-1 py-0.5 text-[11px] font-medium text-amber-700">抵免</span>' : ''}
        </div>
      `;
    }

    function renderCategoryCourses(category, courses) {
      if (!courses.length) return '<span class="text-xs text-slate-300">-</span>';
      if (category === '其他') {
        return renderCourse({ name: '個人興趣選修' });
      }
      return courses.map(renderCourse).join('');
    }

    function displaySemesterName(semester) {
      return String(semester || '').replace(/^(\d{2})\d(-[12])$/, '$1X$2');
    }

    function categoryWidthClass(category) {
      switch (category) {
        case '必修':
          return 'w-28';
        case '必選修-方法':
        case '必選修-實務':
          return 'w-36';
        case '理論/方法':
        case '媒體公民意識':
        case '國際視野':
        case '數位知能':
        case '專業實作':
          return 'w-40';
        default:
          return 'w-28';
      }
    }

    function renderPath(student, categoryMap) {
      document.getElementById('studentMeta').textContent = `共 ${student.semesters.length} 個學期`;
      const table = document.getElementById('coursePathTable');
      table.innerHTML = `
        <table class="course-path-table w-max border-collapse text-left text-sm">
          <thead>
            <tr class="course-path-table__header-row">
              <th class="course-path-table__semester sticky left-0 z-[1] w-24 border border-slate-200 bg-slate-100 px-2 py-1.5 font-semibold text-slate-700">學期</th>
              ${categoryOrder.map((category) => `<th class="course-path-table__category ${categoryWidthClass(category)} border border-slate-200 bg-slate-100 px-2 py-1.5 font-semibold text-slate-700">${categoryDisplayName(category)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${student.semesters.map((semester) => {
              const groups = groupCoursesByCategory(semester.courses, categoryMap);
              return `
                <tr class="course-path-table__row">
                  <th class="course-path-table__semester sticky left-0 z-[1] border border-slate-200 bg-white px-2 py-1.5 align-top font-semibold text-sky-800">${displaySemesterName(semester.semester)}</th>
                  ${categoryOrder.map((category) => `
                    <td class="course-path-table__cell border border-slate-200 bg-slate-50 px-1.5 py-1.5 align-top">
                      ${renderCategoryCourses(category, groups[category])}
                    </td>
                  `).join('')}
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    async function initCoursePath() {
      const status = document.getElementById('coursePathStatus');
      const select = document.getElementById('studentSelect');
      try {
        const response = await fetch('data/courses.csv', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const categoryMap = buildCategoryMap(await response.text());

        select.innerHTML = coursePaths.map((student) => `<option value="${student.id}">${student.name}</option>`).join('');
        select.addEventListener('change', () => {
          const student = coursePaths.find((item) => item.id === select.value) || coursePaths[0];
          renderPath(student, categoryMap);
        });

        status.classList.add('hidden');
        renderPath(coursePaths[0], categoryMap);
      } catch (error) {
        console.error('Error loading course categories:', error);
        status.className = 'border border-dashed border-rose-200 bg-white px-4 py-8 text-center text-sm text-rose-400';
        status.textContent = '無法載入課程分類資料';
      }
    }

    window.addEventListener('load', initCoursePath);
