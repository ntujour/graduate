<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>常態活動 | Regular Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --portal-primary: #0369a1;
      --portal-accent: #0ea5e9;
      --portal-muted: #64748b;
      --portal-muted-strong: #475569;
      --portal-border: rgba(148, 163, 184, 0.28);
      --portal-radius: 3px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    main {
      width: 100%;
    }

    .rounded-2xl,
    .rounded-xl,
    .rounded-lg,
    .rounded {
      border-radius: var(--portal-radius) !important;
    }

    .events-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: var(--portal-radius);
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow: 0 32px 64px -48px rgba(15, 23, 42, 0.55);
      padding: 32px 28px;
    }

    .event-list {
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
    }

    .event-row:last-of-type {
      border-bottom: none;
    }

    .event-month-cell {
      flex: 0 0 90px;
      font-weight: 600;
      font-size: 1rem;
      color: #0284c7;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .event-content-cell {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.95rem;
      color: var(--portal-muted-strong);
    }

    .event-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .event-title,
    .event-title-link {
      font-weight: 600;
      color: #0f172a;
      font-size: 1.05rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .event-title-link:hover {
      color: #0284c7;
      text-decoration: underline;
    }

    .event-description {
      font-size: 0.85rem;
      color: var(--portal-muted);
      line-height: 1.5;
      margin: 0;
    }

    .event-category {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: var(--portal-radius);
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      background: rgba(148, 163, 184, 0.16);
      color: var(--portal-muted-strong);
    }

    .category-工讀與實習 { background: rgba(14, 165, 233, 0.18); color: #0369a1; }
    .category-研討會 { background: rgba(74, 222, 128, 0.2); color: #047857; }
    .category-學生活動 { background: rgba(251, 191, 36, 0.22); color: #b45309; }
    .category-海外交換 { background: rgba(196, 181, 253, 0.22); color: #6b21a8; }
    .category-其他 { background: rgba(148, 163, 184, 0.18); color: #475569; }

    .event-due-inline {
      color: #dc2626;
      font-weight: 600;
      margin-right: 6px;
    }

    .data-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--portal-muted);
      padding: 4px 10px;
      background: rgba(148, 163, 184, 0.12);
      border-radius: var(--portal-radius);
    }

    .data-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .data-status.live .dot { background: #22c55e; }
    .data-status.cached .dot { background: #f59e0b; }
    .data-status.refreshing .dot {
      background: #0ea5e9;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 720px) {
      .events-card {
        padding: 24px 20px;
      }

      .event-month-cell {
        flex-basis: 100%;
        font-size: 0.95rem;
      }

      .event-content-cell {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
  <header class="sticky top-0 border-b border-slate-200 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/70">
    <div class="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="text-lg font-semibold tracking-wide text-sky-800 transition-colors hover:text-sky-600">NTU Journalism Services Portal</a>
      <a href="index.html" class="text-sm font-medium text-slate-500 transition hover:text-sky-600">返回首頁</a>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-5xl flex-col gap-10 px-4 py-12">
    <section class="space-y-3">
      <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-3xl font-semibold tracking-tight text-sky-900">常態活動</h1>
        <span id="data-status" class="data-status">
          <span class="dot"></span>
          <span class="label">載入中…</span>
        </span>
      </div>
      <p class="max-w-3xl text-sm leading-relaxed text-slate-600">匯整每年的常態活動，包含口試申請期限、論文報獎、學術研討會與國際交換申請等重要時間，協助你掌握系上節奏與申請時程。資料直接讀取自 Google Sheet，更新後重新整理頁面即可看到最新內容。</p>
    </section>

    <section class="events-card">
      <div id="regular-event-list" class="event-list"></div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white/90">
    <div class="mx-auto flex w-full max-w-5xl flex-col gap-1 px-4 py-6 text-xs text-slate-400">
      <span>國立臺灣大學 新聞研究所 | NTU Graduate Institute of Journalism</span>
      <span>如有建議或需求，請聯繫系辦。</span>
    </div>
  </footer>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHsu0mwJHBxfuSwglE4PsC2G_F8atdcFZ_j1SSvaNA1QuLlBfVnFXQmYX5Hb5Qp3f1PdtTjQ_4ngi9/pub?gid=2031884623&single=true&output=csv";
    const CACHE_KEY = "regular_event_csv_v1";
    const CACHE_TIME_KEY = "regular_event_csv_time_v1";

    const months = ['一月', '二月', '三月', '四月', '五月', '六月',
                    '七月', '八月', '九月', '十月', '十一月', '十二月'];

    // 處理 CSV 中引號包裹的逗號
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
          else if (c === '"') { inQuotes = false; }
          else { field += c; }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c === '\r') { /* skip */ }
          else { field += c; }
        }
      }
      if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
      return rows;
    }

    function setStatus(state, label) {
      const el = document.getElementById('data-status');
      el.className = `data-status ${state}`;
      el.querySelector('.label').textContent = label;
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function render(csv) {
      const rows = parseCSV(csv);
      const data = rows.slice(1).filter(row => row.length > 1 && row[0]);

      const listContainer = document.getElementById('regular-event-list');
      listContainer.innerHTML = '';

      let isFirstMonth = true;
      months.forEach((month, index) => {
        const monthNumber = index + 1;
        const monthEvents = data.filter(row => parseInt(row[2]) === monthNumber);
        if (monthEvents.length === 0) return;

        if (!isFirstMonth) {
          const hr = document.createElement('hr');
          hr.style.border = 'none';
          hr.style.borderTop = '1px solid rgba(148, 163, 184, 0.28)';
          hr.style.margin = '18px 0 12px 0';
          listContainer.appendChild(hr);
        }
        isFirstMonth = false;

        monthEvents.forEach((event, i) => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'event-row';

          const monthCell = document.createElement('div');
          monthCell.className = 'event-month-cell';
          monthCell.textContent = i === 0 ? month : '';

          const contentCell = document.createElement('div');
          contentCell.className = 'event-content-cell';

          const titleRow = document.createElement('div');
          titleRow.className = 'event-title-row';
          const link = event[5]?.trim();
          let titleDiv;
          if (link) {
            titleDiv = document.createElement('a');
            titleDiv.className = 'event-title-link';
            titleDiv.href = link;
            titleDiv.target = '_blank';
            titleDiv.rel = 'noopener noreferrer';
            titleDiv.textContent = event[0].trim();
          } else {
            titleDiv = document.createElement('span');
            titleDiv.className = 'event-title';
            titleDiv.textContent = event[0].trim();
          }
          titleRow.appendChild(titleDiv);

          const category = event[1]?.trim() || '其他';
          const categorySpan = document.createElement('span');
          categorySpan.className = 'event-category category-' + category;
          categorySpan.textContent = category;
          titleRow.appendChild(categorySpan);

          contentCell.appendChild(titleRow);

          const due = event[3]?.trim();
          const descText = event[4]?.trim() || '';
          if (due || descText) {
            const descParagraph = document.createElement('p');
            descParagraph.className = 'event-description';
            if (due) {
              const dueSpan = document.createElement('span');
              dueSpan.className = 'event-due-inline';
              dueSpan.textContent = `截止日期：${due} `;
              descParagraph.appendChild(dueSpan);
            }
            descParagraph.appendChild(document.createTextNode(descText));
            contentCell.appendChild(descParagraph);
          }

          rowDiv.appendChild(monthCell);
          rowDiv.appendChild(contentCell);
          listContainer.appendChild(rowDiv);
        });
      });
    }

    function showError(message) {
      const listContainer = document.getElementById('regular-event-list');
      listContainer.innerHTML = `
        <div style="color: #dc2626; padding: 20px; text-align: center;">
          <p>無法讀取資料。</p>
          <p style="font-size: 0.85rem; margin-top: 8px;">${message}</p>
        </div>
      `;
    }

    // Stale-while-revalidate：先用快取立刻渲染，背景更新
    (async function () {
      const cached = localStorage.getItem(CACHE_KEY);
      const cachedTime = localStorage.getItem(CACHE_TIME_KEY);

      if (cached) {
        render(cached);
        setStatus('cached', `顯示快取版本（${formatTime(parseInt(cachedTime))}），更新中…`);
      } else {
        setStatus('refreshing', '載入中…');
      }

      try {
        const res = await fetch(SHEET_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csv = await res.text();

        if (csv !== cached) {
          render(csv);
          localStorage.setItem(CACHE_KEY, csv);
          localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
          setStatus('live', `已更新至最新版本（${formatTime(Date.now())}）`);
        } else {
          setStatus('live', `資料為最新版本（${formatTime(Date.now())}）`);
          localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
        }
      } catch (err) {
        if (cached) {
          setStatus('cached', `離線中，顯示快取版本（${formatTime(parseInt(cachedTime))}）`);
        } else {
          showError(err.message);
          setStatus('cached', '無法連線');
        }
      }
    })();
  </script>
</body>
</html>
